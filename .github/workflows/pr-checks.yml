name: PR Checks

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write  # Required for SARIF upload

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean test -pl app

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: 'app/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/target/surefire-reports/
          if-no-files-found: ignore

  ktlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create reports directory
        run: mkdir -p app/target/reports

      - name: Run ktlint check
        id: ktlint
        run: |
          ./mvnw exec:exec@ktlint-check -pl app
        continue-on-error: true

      - name: Upload ktlint HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-html-report
          path: app/target/reports/ktlint.html
          if-no-files-found: ignore

      - name: Upload ktlint SARIF to GitHub Security
        if: always() && hashFiles('app/target/reports/ktlint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/target/reports/ktlint.sarif
          category: ktlint
        continue-on-error: true

      - name: Generate ktlint Summary
        if: always()
        run: |
          echo "## 🎨 ktlint Code Style" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f app/target/reports/ktlint.html ]; then
            echo "✅ HTML report generated - download from Artifacts" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.ktlint.outcome }}" == "success" ]; then
            echo "### ✅ No style issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Style issues detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📥 Download the **ktlint-html-report** artifact for details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Fix command:** \`./mvnw exec:exec@ktlint-format -pl app\`" >> $GITHUB_STEP_SUMMARY
          fi

  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create reports directory
        run: mkdir -p app/target/reports

      - name: Run detekt
        id: detekt
        run: |
          ./mvnw antrun:run@detekt -pl app
        continue-on-error: true

      - name: Upload detekt HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-html-report
          path: app/target/reports/detekt.html
          if-no-files-found: ignore

      - name: Upload detekt SARIF to GitHub Security
        if: always() && hashFiles('app/target/reports/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/target/reports/detekt.sarif
          category: detekt
        continue-on-error: true

      - name: Generate detekt Summary
        if: always()
        run: |
          echo "## 🔍 detekt Code Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f app/target/reports/detekt.md ]; then
            # Extract issue count from "## Findings (N)" line
            issue_count=$(grep -oP '## Findings \(\K\d+' app/target/reports/detekt.md 2>/dev/null || echo "0")

            if [ "$issue_count" -gt 0 ]; then
              echo "### ⚠️ Found $issue_count code quality issues" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ No code quality issues found" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            cat app/target/reports/detekt.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "**Local check:** \`./mvnw antrun:run@detekt -pl app\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ No detekt report generated" >> $GITHUB_STEP_SUMMARY
          fi
