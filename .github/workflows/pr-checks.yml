name: PR Checks

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

# Required for posting PR comments
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean test -pl app

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/target/surefire-reports/*.xml'
          comment_mode: 'off'
          job_summary: true

  ktlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run ktlint check
        id: ktlint
        run: |
          ./mvnw exec:exec@ktlint-check -pl app 2>&1 | tee ktlint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate ktlint summary
        if: always()
        run: |
          echo "## 🔍 ktlint Code Style Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ktlint-output.txt ]; then
            # Count issues
            issue_count=$(grep -c '\.kt:[0-9]*:[0-9]*:' ktlint-output.txt || echo "0")

            if [ "$issue_count" -gt 0 ]; then
              echo "### ❌ Found $issue_count code style issues" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>Click to expand issues</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| File | Line | Rule | Message |" >> $GITHUB_STEP_SUMMARY
              echo "|------|------|------|---------|" >> $GITHUB_STEP_SUMMARY

              grep '\.kt:[0-9]*:[0-9]*:' ktlint-output.txt | head -50 | while read -r line; do
                # Parse: src/path/File.kt:10:1: Message (rule)
                file=$(echo "$line" | sed 's/:.*//')
                location=$(echo "$line" | grep -oP ':\d+:\d+' | head -1 | tr -d ':' | head -c 10)
                message=$(echo "$line" | sed 's/.*:[0-9]*:[0-9]*: //' | sed 's/ (.*)//')
                rule=$(echo "$line" | grep -oP '\([^)]+\)$' | tr -d '()')
                echo "| \`$file\` | $location | \`$rule\` | $message |" >> $GITHUB_STEP_SUMMARY
              done

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🔧 How to fix" >> $GITHUB_STEP_SUMMARY
              echo '```bash' >> $GITHUB_STEP_SUMMARY
              echo './mvnw exec:exec@ktlint-format -pl app' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ No code style issues found" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail if ktlint found issues
        if: steps.ktlint.outputs.exit_code != '0'
        run: exit 1

  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run detekt
        id: detekt
        run: |
          # Run detekt and capture output
          ./mvnw antrun:run@detekt -pl app 2>&1 | tee detekt-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate detekt summary
        if: always()
        run: |
          echo "## 🔬 detekt Static Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f detekt-output.txt ]; then
            # Extract issues
            grep '\[detekt\].*\[' detekt-output.txt | grep '\.kt:' > detekt-issues.txt || true
            issue_count=$(wc -l < detekt-issues.txt | tr -d ' ')

            if [ "$issue_count" -gt 0 ]; then
              echo "### ⚠️ Found $issue_count code quality issues" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Count by type
              echo "### 📊 Summary by Type" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Rule | Count | Severity |" >> $GITHUB_STEP_SUMMARY
              echo "|------|-------|----------|" >> $GITHUB_STEP_SUMMARY

              grep -oP '\[\w+\]$' detekt-issues.txt | sort | uniq -c | sort -rn | while read -r count rule; do
                rule_name=$(echo "$rule" | tr -d '[]')
                severity="⚠️ Warning"
                case "$rule_name" in
                  TooGenericExceptionCaught|SwallowedException) severity="🔴 High" ;;
                  UnusedParameter|MagicNumber) severity="🟡 Medium" ;;
                  *) severity="🟢 Low" ;;
                esac
                echo "| \`$rule_name\` | $count | $severity |" >> $GITHUB_STEP_SUMMARY
              done

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 📝 Issues by File" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Group by file
              for file in $(grep -oP '/[^:]+\.kt' detekt-issues.txt | sort -u); do
                filename=$(basename "$file")
                file_issues=$(grep "$file" detekt-issues.txt | wc -l)
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><code>$filename</code> ($file_issues issues)</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "| Line | Rule | Message |" >> $GITHUB_STEP_SUMMARY
                echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY

                grep "$file" detekt-issues.txt | while read -r line; do
                  line_num=$(echo "$line" | grep -oP '\.kt:\d+' | grep -oP '\d+')
                  rule=$(echo "$line" | grep -oP '\[\w+\]$' | tr -d '[]')
                  message=$(echo "$line" | sed 's/.*\.kt:[0-9]*:[0-9]*: //' | sed 's/ \[.*$//')
                  echo "| $line_num | \`$rule\` | $message |" >> $GITHUB_STEP_SUMMARY
                done

                echo "" >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              done

              echo "### 🔧 How to fix" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Run locally to see full report:" >> $GITHUB_STEP_SUMMARY
              echo '```bash' >> $GITHUB_STEP_SUMMARY
              echo './mvnw antrun:run@detekt -pl app' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📚 [detekt Rules Documentation](https://detekt.dev/docs/rules/style)" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ No code quality issues found" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/target/reports/detekt.xml'
          if-no-files-found: ignore

      # Optional: Post PR comment (requires permissions)
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('detekt-issues.txt')) return;

            const issues = fs.readFileSync('detekt-issues.txt', 'utf8').trim().split('\n').filter(Boolean);
            if (issues.length === 0) return;

            // Count by type
            const counts = {};
            issues.forEach(line => {
              const match = line.match(/\[(\w+)\]$/);
              if (match) counts[match[1]] = (counts[match[1]] || 0) + 1;
            });

            const summary = Object.entries(counts)
              .sort((a, b) => b[1] - a[1])
              .map(([rule, count]) => `| \`${rule}\` | ${count} |`)
              .join('\n');

            const body = `## 🔬 detekt Analysis Results

            Found **${issues.length}** code quality issues.

            | Rule | Count |
            |------|-------|
            ${summary}

            📋 See the [Job Summary](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for full details.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
