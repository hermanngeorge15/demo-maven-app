name: PR Checks

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean test -pl app

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find test report files
          if [ -d "app/target/surefire-reports" ]; then
            total_tests=0
            passed_tests=0
            failed_tests=0
            skipped_tests=0

            # Parse XML reports
            for xml in app/target/surefire-reports/*.xml; do
              if [ -f "$xml" ]; then
                tests=$(grep -oP 'tests="\K[0-9]+' "$xml" | head -1 || echo "0")
                failures=$(grep -oP 'failures="\K[0-9]+' "$xml" | head -1 || echo "0")
                errors=$(grep -oP 'errors="\K[0-9]+' "$xml" | head -1 || echo "0")
                skipped=$(grep -oP 'skipped="\K[0-9]+' "$xml" | head -1 || echo "0")

                total_tests=$((total_tests + tests))
                failed_tests=$((failed_tests + failures + errors))
                skipped_tests=$((skipped_tests + skipped))
              fi
            done

            passed_tests=$((total_tests - failed_tests - skipped_tests))

            if [ "$failed_tests" -gt 0 ]; then
              echo "### ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $passed_tests |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $failed_tests |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $skipped_tests |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$total_tests** |" >> $GITHUB_STEP_SUMMARY

            # Show failed tests details
            if [ "$failed_tests" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              for txt in app/target/surefire-reports/*.txt; do
                if [ -f "$txt" ] && grep -q "FAILURE\|ERROR" "$txt" 2>/dev/null; then
                  testname=$(basename "$txt" .txt)
                  echo "<details>" >> $GITHUB_STEP_SUMMARY
                  echo "<summary>❌ $testname</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  cat "$txt" | head -100 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi
              done
            fi

            # Show test classes summary
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Classes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Class | Tests | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|--------|" >> $GITHUB_STEP_SUMMARY

            for xml in app/target/surefire-reports/TEST-*.xml; do
              if [ -f "$xml" ]; then
                classname=$(grep -oP 'name="\K[^"]+' "$xml" | head -1)
                tests=$(grep -oP 'tests="\K[0-9]+' "$xml" | head -1 || echo "0")
                failures=$(grep -oP 'failures="\K[0-9]+' "$xml" | head -1 || echo "0")
                errors=$(grep -oP 'errors="\K[0-9]+' "$xml" | head -1 || echo "0")

                if [ "$((failures + errors))" -gt 0 ]; then
                  status="❌ Failed"
                else
                  status="✅ Passed"
                fi

                # Shorten class name for readability
                shortname=$(echo "$classname" | sed 's/.*\.//')
                echo "| \`$shortname\` | $tests | $status |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "### ⚠️ No test reports found" >> $GITHUB_STEP_SUMMARY
          fi

  ktlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run ktlint check
        id: ktlint
        run: |
          ./mvnw exec:exec@ktlint-check -pl app 2>&1 | tee ktlint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate ktlint Summary
        if: always()
        run: |
          echo "## 🎨 ktlint Code Style" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ktlint-output.txt ]; then
            issue_count=$(grep -c '\.kt:[0-9]*:[0-9]*:' ktlint-output.txt 2>/dev/null || echo "0")

            if [ "$issue_count" -gt 0 ]; then
              echo "### ❌ Found $issue_count style issues" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| File | Line | Issue |" >> $GITHUB_STEP_SUMMARY
              echo "|------|------|-------|" >> $GITHUB_STEP_SUMMARY

              grep '\.kt:[0-9]*:[0-9]*:' ktlint-output.txt | head -30 | while read -r line; do
                file=$(echo "$line" | cut -d: -f1 | xargs basename)
                linenum=$(echo "$line" | cut -d: -f2)
                msg=$(echo "$line" | cut -d: -f4- | sed 's/^ //')
                echo "| \`$file\` | $linenum | $msg |" >> $GITHUB_STEP_SUMMARY
              done

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Fix command:** \`./mvnw exec:exec@ktlint-format -pl app\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ No style issues found" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail if ktlint found issues
        if: steps.ktlint.outputs.exit_code != '0'
        run: exit 1

  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run detekt
        id: detekt
        run: |
          ./mvnw antrun:run@detekt -pl app 2>&1 | tee detekt-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Generate detekt Summary
        if: always()
        run: |
          echo "## 🔍 detekt Code Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f detekt-output.txt ]; then
            grep '\[detekt\].*\[' detekt-output.txt | grep '\.kt:' > detekt-issues.txt 2>/dev/null || true
            issue_count=$(wc -l < detekt-issues.txt 2>/dev/null | tr -d ' ' || echo "0")

            if [ "$issue_count" -gt 0 ] && [ "$issue_count" != "0" ]; then
              echo "### ⚠️ Found $issue_count code quality issues" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Summary table
              echo "| Category | Count | Severity |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|-------|----------|" >> $GITHUB_STEP_SUMMARY

              grep -oP '\[\w+\]$' detekt-issues.txt | sort | uniq -c | sort -rn | while read -r count rule; do
                rule_name=$(echo "$rule" | tr -d '[]')
                case "$rule_name" in
                  TooGenericExceptionCaught|SwallowedException) sev="🔴 High" ;;
                  UnusedParameter|ReturnCount) sev="🟡 Medium" ;;
                  MagicNumber|SpreadOperator) sev="🟢 Low" ;;
                  *) sev="⚪ Info" ;;
                esac
                echo "| \`$rule_name\` | $count | $sev |" >> $GITHUB_STEP_SUMMARY
              done

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Issues by File" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Group by file
              for filepath in $(grep -oP '/[^:]+\.kt' detekt-issues.txt | sort -u); do
                filename=$(basename "$filepath")
                count=$(grep "$filepath" detekt-issues.txt | wc -l)

                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary><code>$filename</code> — $count issues</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "| Line | Rule | Description |" >> $GITHUB_STEP_SUMMARY
                echo "|------|------|-------------|" >> $GITHUB_STEP_SUMMARY

                grep "$filepath" detekt-issues.txt | while read -r line; do
                  linenum=$(echo "$line" | grep -oP '\.kt:\K\d+')
                  rule=$(echo "$line" | grep -oP '\[\w+\]$' | tr -d '[]')
                  desc=$(echo "$line" | sed 's/.*\.kt:[0-9]*:[0-9]*: //' | sed 's/ \[.*$//' | head -c 80)
                  echo "| $linenum | \`$rule\` | $desc |" >> $GITHUB_STEP_SUMMARY
                done

                echo "" >> $GITHUB_STEP_SUMMARY
                echo "</details>" >> $GITHUB_STEP_SUMMARY
              done

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Local check:** \`./mvnw antrun:run@detekt -pl app\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📚 [detekt Rules](https://detekt.dev/docs/rules/style)" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ No code quality issues found" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/target/reports/detekt.xml'
          if-no-files-found: ignore
