name: PR Checks

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean test -pl app

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: 'app/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/target/surefire-reports/
          if-no-files-found: ignore

  ktlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create reports directory
        run: mkdir -p app/target/reports

      - name: Run ktlint check
        id: ktlint
        run: |
          ./mvnw exec:exec@ktlint-check -pl app 2>&1 | tee app/target/reports/ktlint.txt
        continue-on-error: true

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/target/reports/ktlint.html
            app/target/reports/ktlint.txt
          if-no-files-found: ignore

      - name: Upload ktlint SARIF to GitHub Security
        if: always() && hashFiles('app/target/reports/ktlint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/target/reports/ktlint.sarif
          category: ktlint
        continue-on-error: true

      - name: Generate ktlint Summary
        if: always()
        run: |
          echo "## 🎨 ktlint Code Style" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f app/target/reports/ktlint.txt ]; then
            issue_count=$(grep -cE '\.kt:[0-9]+:[0-9]+:' app/target/reports/ktlint.txt 2>/dev/null || echo "0")

            if [ "$issue_count" -gt 0 ]; then
              echo "### ⚠️ Found $issue_count style issues" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| File | Line | Column | Issue |" >> $GITHUB_STEP_SUMMARY
              echo "|------|------|--------|-------|" >> $GITHUB_STEP_SUMMARY

              grep -E '\.kt:[0-9]+:[0-9]+:' app/target/reports/ktlint.txt | head -50 | while read -r line; do
                file=$(echo "$line" | sed 's/.*\/\([^/]*\.kt\):.*/\1/')
                location=$(echo "$line" | grep -oE '\.kt:[0-9]+:[0-9]+' | sed 's/\.kt://')
                line_num=$(echo "$location" | cut -d: -f1)
                col_num=$(echo "$location" | cut -d: -f2)
                msg=$(echo "$line" | sed 's/.*\.kt:[0-9]*:[0-9]*: //')
                echo "| \`$file\` | $line_num | $col_num | $msg |" >> $GITHUB_STEP_SUMMARY
              done

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Fix command:** \`./mvnw exec:exec@ktlint-format -pl app\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ No style issues found" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⚠️ No ktlint report generated" >> $GITHUB_STEP_SUMMARY
          fi

  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create reports directory
        run: mkdir -p app/target/reports

      - name: Run detekt
        id: detekt
        run: |
          ./mvnw antrun:run@detekt -pl app
        continue-on-error: true

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            app/target/reports/detekt.html
            app/target/reports/detekt.md
          if-no-files-found: ignore

      - name: Upload detekt SARIF to GitHub Security
        if: always() && hashFiles('app/target/reports/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/target/reports/detekt.sarif
          category: detekt
        continue-on-error: true

      - name: Generate detekt Summary
        if: always()
        run: |
          echo "## 🔍 detekt Code Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f app/target/reports/detekt.md ]; then
            issue_count=$(grep -oP '## Findings \(\K\d+' app/target/reports/detekt.md 2>/dev/null || echo "0")

            if [ "$issue_count" -gt 0 ]; then
              echo "### ⚠️ Found $issue_count code quality issues" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ No code quality issues found" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            cat app/target/reports/detekt.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "**Local check:** \`./mvnw antrun:run@detekt -pl app\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ No detekt report generated" >> $GITHUB_STEP_SUMMARY
          fi

  # Deploy HTML reports to GitHub Pages
  deploy-reports:
    runs-on: ubuntu-latest
    needs: [ktlint, detekt]
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download ktlint reports
        uses: actions/download-artifact@v4
        with:
          name: ktlint-reports
          path: reports/ktlint
        continue-on-error: true

      - name: Download detekt reports
        uses: actions/download-artifact@v4
        with:
          name: detekt-reports
          path: reports/detekt
        continue-on-error: true

      - name: Create index page
        run: |
          cat > reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Code Quality Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
              h1 { color: #333; }
              .report-link { display: block; padding: 15px; margin: 10px 0; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #0366d6; }
              .report-link:hover { background: #e8e8e8; }
              .timestamp { color: #666; font-size: 0.9em; }
            </style>
          </head>
          <body>
            <h1>📊 Code Quality Reports</h1>
            <p class="timestamp">Generated: TIMESTAMP</p>
            <a class="report-link" href="ktlint/ktlint.html">🎨 ktlint - Code Style Report</a>
            <a class="report-link" href="detekt/detekt.html">🔍 detekt - Code Analysis Report</a>
          </body>
          </html>
          EOF
          sed -i "s/TIMESTAMP/$(date -u '+%Y-%m-%d %H:%M:%S UTC')/" reports/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report links to summary
        run: |
          echo "## 📊 HTML Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the full HTML reports:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🎨 [ktlint Report](${{ steps.deployment.outputs.page_url }}ktlint/ktlint.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 [detekt Report](${{ steps.deployment.outputs.page_url }}detekt/detekt.html)" >> $GITHUB_STEP_SUMMARY
